name: Train GPT Model

on:
  workflow_dispatch:  # Apenas manual — evita treinos desnecessários
    inputs:
      epochs:
        description: 'Número de epochs'
        required: false
        default: '2000'
        type: string
      embed:
        description: 'Embedding dimension'
        required: false
        default: '128'
        type: string
      layers:
        description: 'Número de layers'
        required: false
        default: '4'
        type: string

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~6 horas max

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Train model
        run: |
          python train.py \
            --model gpt \
            --file livros \
            --embed ${{ inputs.embed || '128' }} \
            --hidden 256 \
            --layers ${{ inputs.layers || '4' }} \
            --heads 8 \
            --batch 32 \
            --seq-len 128 \
            --epochs ${{ inputs.epochs || '70' }} \
            --lr 0.0003 \
            --dropout 0.1 \
            --max-chars 0 \
            --temperature 0.8 \
            --top-p 0.9 \
            --top-k 40 \
            --save modelo_cloud.npz

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modelo-gpt-treinado
          path: |
            modelo_cloud.npz
            modelo_cloud.npz.meta.json
          retention-days: 90

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modelo-v${{ github.run_number }}
          name: "🧠 Modelo GPT Treinado #${{ github.run_number }}"
          body: |
            ## 🧠 Modelo treinado automaticamente

            **Arquitetura:** GPT Decoder (RMSNorm + SwiGLU + RoPE)
            **Dados:** 8 livros da literatura brasileira (~3.6M caracteres)
            **Embed/Hidden:** 128/256 | **Layers:** 4 | **Heads:** 8
            **Epochs:** ${{ inputs.epochs || '2000' }} | **Batch:** 32 | **Seq Len:** 128

            ### Como usar
            ```bash
            pip install numpy
            python train.py --load modelo_cloud.npz -i
            ```

            ### Exemplo de código
            ```python
            from train import load_model
            model, dataset = load_model("modelo_cloud.npz")
            text = model.generate(dataset, "O", length=500)
            print(text)
            ```
          files: |
            modelo_cloud.npz
            modelo_cloud.npz.meta.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
